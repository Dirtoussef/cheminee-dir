<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheminées Prestige</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% if request.path == '/Services' or request.path == '/Nos Réalisations' %}navbar-orange{% else %}navbar-light{% endif %}">

  

    <!-- Menu latéral gauche (sidebar mobile) -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" id="closeSidebar">&times;</a>
        <a href="{{ url_for('home') }}">Accueil</a>
        <a href="/Services">Services</a>
        <a href="/Nos Réalisations">Nos Réalisations</a>
    </div>



<div class="mobile-header">
    <button class="openbtn" id="openSidebar" aria-label="Ouvrir le menu">&#9776;</button>
    <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='imges/Fireplace.png') }}" alt="Cheminées Prestige Logo" class="mobile-logo">
    </a>
</div>
    

    <!-- 👉 Overlay pour fermer le menu mobile en cliquant à côté -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Menu de navigation pour desktop -->
    <nav class="navbar desktop-navbar">
        <ul class="nav-list">
            <li><a href="{{ url_for('home') }}">Accueil</a></li>
            <li><a href="/Services">Services</a></li>
            <li><a href="/Nos Réalisations">Nos Réalisations</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="mailto:contact@chemineemaroc.com" target="_blank">
                    <i class="fas fa-envelope"></i> Email
                </a>
                <a href="https://wa.me/212661613631" target="_blank">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://www.instagram.com/chemineemaroc" target="_blank">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                <a href="https://www.linkedin.com/company/chemineemaroc" target="_blank">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://www.google.com/maps?q=Cheminée+Maroc" target="_blank">
                    <i class="fas fa-map-marker-alt"></i> Adresse
                </a>
            </div>
            <p class="footer-copy">© 2024 Cheminée Maroc. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/212661613631?text=Bonjour%20Cheminée%20Maroc,%20je%20souhaite..." 
        class="whatsapp-float" 
        target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>    

 <script>
        document.addEventListener('DOMContentLoaded', function () {
            const openBtn = document.getElementById("openSidebar");
            const closeBtn = document.getElementById("closeSidebar");
            const sidebar = document.getElementById("mySidebar");
            const overlay = document.getElementById("sidebarOverlay");

            openBtn.addEventListener("click", () => {
                sidebar.classList.add("open");
                overlay.classList.add("show");
            });

            closeBtn.addEventListener("click", () => {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
            });

            overlay.addEventListener("click", () => {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
            });
        });
    </script>

</body>
</html>
